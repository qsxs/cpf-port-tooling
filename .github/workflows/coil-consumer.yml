name: Anonymous Coil Pages consumer

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: '对应 producer 的 40 位 Coil source SHA'
        required: true
        type: string
      version:
        description: '已发布的 Coil preview version'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: controlled-coil-pages-consumer
  cancel-in-progress: false

jobs:
  consumer:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Prepare run identity
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
          OUTPUT: ${{ runner.temp }}/coil-consumer-${{ github.run_id }}-${{ github.run_attempt }}
          TOOLING_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^3\.3\.0-cpf11-preview-${SOURCE_SHA:0:12}-[1-9][0-9]*-[1-9][0-9]*$ ]]
          mkdir "$OUTPUT"
          printf 'source=%s\nversion=%s\ntooling=%s\n' "$SOURCE_SHA" "$VERSION" "$TOOLING_SHA" > "$OUTPUT/workflow-context.txt"
      - name: Checkout consumer tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - name: Checkout source recipe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qsxs/coil
          ref: ${{ inputs.source_sha }}
          path: coil
          persist-credentials: false
      - name: Checkout locked Native tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qsxs/cpf-port-tooling
          ref: d0cff88fd1ea2e4f08bb4409f1c802cca0c7f285
          path: locked-tools
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Bootstrap fixed Native compiler
        shell: bash
        env:
          OUTPUT: ${{ runner.temp }}/coil-consumer-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python -B tooling/scripts/coil_native_bootstrap.py --locked-tools locked-tools \
            --destination "$OUTPUT/native"
      - name: Verify anonymous graph and compile consumer
        shell: bash
        env:
          COIL_SOURCE_SHA: ${{ inputs.source_sha }}
          COIL_VERSION: ${{ inputs.version }}
          COIL_CHECKOUT: ${{ github.workspace }}/coil
          COIL_CONSUMER_OUTPUT: ${{ runner.temp }}/coil-consumer-${{ github.run_id }}-${{ github.run_attempt }}/consumer-output
          COIL_NATIVE_HOME: ${{ runner.temp }}/coil-consumer-${{ github.run_id }}-${{ github.run_attempt }}/native/kotlin-native-prebuilt-linux-x86_64-2.4.20-0.1.0-08
        run: python -B tooling/scripts/coil_consumer.py
      - name: Upload consumer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coil-consumer-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/coil-consumer-${{ github.run_id }}-${{ github.run_attempt }}/workflow-context.txt
            ${{ runner.temp }}/coil-consumer-${{ github.run_id }}-${{ github.run_attempt }}/native/download-receipt.json
            ${{ runner.temp }}/coil-consumer-${{ github.run_id }}-${{ github.run_attempt }}/native/bootstrap-receipt.json
            ${{ runner.temp }}/coil-consumer-${{ github.run_id }}-${{ github.run_attempt }}/consumer-output/evidence/
          if-no-files-found: warn
          retention-days: 14
