name: Controlled Grid producer

on:
  workflow_dispatch:
    inputs:
      grid_sha:
        description: 'qsxs/gridlayout-compose 的不可变 40 位 commit SHA'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: controlled-grid-producer
  cancel-in-progress: false

jobs:
  grid:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Validate source identifier
        shell: bash
        env:
          GRID_SHA: ${{ inputs.grid_sha }}
        run: |
          [[ "$GRID_SHA" =~ ^[0-9a-f]{40}$ ]] || { printf '%s\n' 'A full immutable Grid commit is required' >&2; exit 1; }
      - name: Checkout producer tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: tooling
          persist-credentials: false
      - name: Checkout fixed Grid source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: qsxs/gridlayout-compose
          ref: ${{ inputs.grid_sha }}
          path: grid
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build and verify Grid staging repository
        shell: bash
        env:
          GRID_SHA: ${{ inputs.grid_sha }}
          GRID_CHECKOUT: ${{ github.workspace }}/grid
          GRID_PRODUCER_OUTPUT: ${{ runner.temp }}/grid-producer-${{ github.run_id }}-${{ github.run_attempt }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_TOOLING_SHA: ${{ github.sha }}
        run: python -B tooling/scripts/grid_producer.py
      - name: Upload verified complete Maven staging
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grid-maven-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/grid-producer-${{ github.run_id }}-${{ github.run_attempt }}/staging/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload bounded evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grid-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/grid-producer-${{ github.run_id }}-${{ github.run_attempt }}/evidence/
          if-no-files-found: warn
          retention-days: 14
